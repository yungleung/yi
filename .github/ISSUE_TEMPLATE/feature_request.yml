name: Feature request
description: Suggest an improvement to a Yi workflow.
title: "[Feature]: "
labels:
  - enhancement
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        Describe the writing or knowledge-management problem first. A concrete
        workflow and sample Markdown help more than a list of interface controls.

        If this is an early idea rather than a concrete request, start a
        [discussion in Ideas](https://github.com/yungleung/yi/discussions/categories/ideas).

  - type: textarea
    id: problem
    attributes:
      label: Problem or limitation
      description: What are you trying to do, and where does Yi make it difficult?
    validations:
      required: true

  - type: dropdown
    id: workflow
    attributes:
      label: Main workflow
      options:
        - Daily notes
        - Personal knowledge base
        - Research and citations
        - Writing and publishing
        - Templates and export
        - Accessibility or interface
        - Other
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the result you want. Interface sketches and Markdown examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, commands or workarounds you have tried.

  - type: textarea
    id: sample
    attributes:
      label: Example Markdown, metadata or template
      render: markdown

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues, discussions and documentation.
          required: true
        - label: This request describes a workflow rather than only a preferred implementation.
          required: true
