# ZETTLR DEFAULTS FILE
# ====================
# Conversion: Markdown --> Word document
# More info: https://pandoc.org/MANUAL.html
#
# Yi's copy of that file: it is written into the app's data folder the first time an export of
# this kind needs it, and every export then hands it to pandoc unchanged (`--defaults`), so a key
# below is pandoc's own and the manual above says what it means. A file that is already there is
# never overwritten — an edited one is the reader's.
#
# One key of Zettlr's is *not* here. `default-image-extension: .jpg` is what that file ships, and
# pandoc applies it to any image destination whose path has no extension — a URL as well as a file:
# `https://placehold.co/200x80/png` became `https://placehold.co/200x80/png.jpg`, which is a 404,
# and the picture was replaced by its own description (measured). Left out, pandoc uses the path it
# was given, which is what a note's own picture is named.
#
# Two things the app adds on the command line, because they are its own settings rather than this
# file's: the bibliography the citations were formatted from (Settings → Citation) and the CSL style
# it formats them in, so citeproc resolves the keys and appends the reference list. A reader who
# wants none of that can set `filters: []` here, or clear the bibliography in the settings.
reader: markdown
writer: docx
self-contained: true
variables: {}
metadata-files: []
include-before-body: []
include-after-body: []
include-in-header: []
bibliography: []
filters:
- type: citeproc
top-level-division: chapter
wrap: none
columns: 78
dpi: 72
toc: false
toc-depth: 2
number-sections: false
number-offset:
- 0
- 0
- 0
- 0
- 0
- 0
shift-heading-level-by: 1
section-divs: true
identifier-prefix: ''
title-prefix: ''
eol: lf
strip-comments: false
indented-code-classes: []
ascii: false
highlight-style: pygments
tab-stop: 4
preserve-tabs: false
fail-if-warnings: false
