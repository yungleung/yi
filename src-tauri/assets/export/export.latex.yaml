# ZETTLR DEFAULTS FILE
# ====================
# Conversion: Markdown --> LaTeX document
# More info: https://pandoc.org/MANUAL.html
#
# Yi's copy of that file, as its `export.docx.yaml` is: it is written into the app's data folder the
# first time an export of this kind needs it, and every export then hands it to pandoc unchanged
# (`--defaults`), so a key below is pandoc's own and the manual above says what it means. A file
# that is already there is never overwritten — an edited one is the reader's.
#
# Zettlr's `default-image-extension: .jpg` is the one key left out, here and in every kind's file:
# pandoc applies it to an image destination whose path has no extension — a URL as well as a file —
# so a working web picture became `…/png.jpg` and a 404 (measured; `export.docx.yaml` has the long
# version). Left out, pandoc uses the path exactly as it was written.
#
# `standalone: true` is the one key *added*: Zettlr's file is a whole document only because of
# `title-prefix`, which pandoc reads as asking for one (measured: the same file without that line
# is a bare fragment — `\section{…}` and no `\documentclass` — and a `.tex` that cannot be
# compiled on its own). Saying it outright means a reader who trims the file still gets a document.
#
# `self-contained: false` is Zettlr's, and it is the point of a LaTeX export: the pictures are
# *referred to* — `\includegraphics` with the path the note's picture is at, absolute, because the
# app resolved it (`src/ui/export/preprocess.ts`) — rather than carried in the file, so the reader
# compiles the document with their own LaTeX and its own `graphicx`. The paths come out right for
# names with a space, a `#` or a `%` in them: pandoc decodes what markdown needed escaped and
# escapes what LaTeX needs (measured, through the app).
#
# Two things the app adds on the command line, because they are its own settings rather than this
# file's: the bibliography the citations were formatted from (Settings → Citation) and the CSL style
# it formats them in, so citeproc resolves the keys and appends the reference list. A reader who
# wants none of that can set `filters: []` here, or clear the bibliography in the settings.
#
# **This file names no font, and that is deliberate.** A `.tex` is compiled on the reader's own machine,
# so the app's own faces cannot reach it (a path into this app's bundle would not exist there) and the
# only way a font gets in is a name written *here*. A name that machine does not have is worse than no
# name at all: with none, the card says before the export which characters need a font and names the
# widest one *this* machine is known to have (`mainfont:`, or `CJKmainfont:` for Han and kana); with a
# wrong one, the compile stops with *"The font … cannot be found"* and a reader who never opened this
# file has nothing to go on. Measured: the same `.tex` **with** `variables: CJKmainfont` carries
# `\usepackage{xeCJK}` and `\setCJKmainfont[]{…}`, and xelatex compiles its CJK with no *"Missing
# character"* warnings — so naming one works, it is just the reader's to do.
#
# What a name here has to be is a font of the **compiling** machine — and that is why the default is
# none: the name this file used to ship was macOS `Songti SC`, which a Mac may not have at all. On the
# machine this file was written on it sits in Apple's own `Supplemental` tree, which is both where
# macOS parks fonts it has not installed yet and where Microsoft Office puts some of its own; the
# reader who reported it had it from Word. And `CJKmainfont` is xeCJK's, which reaches CJK punctuation,
# kana and Han and, measured, **no Hangul at all**: a note in Hangul, or in a script outside CJK, wants
# `mainfont:` with a font that has it.
#
# To name one, replace the empty `variables: {}` below with the line you want — `variables:` on its own
#
#     variables:
#       CJKmainfont: "…"
#
# — or write it in place (`variables: {CJKmainfont: "…"}`); they are the same file to pandoc. What it
# may **not** be is `variables:` with nothing under it: measured, comments alone leave that key null and
# pandoc refuses the whole file (*"Error in $: Expecting MapVal"*), which is why the shape below is `{}`.
reader: markdown
writer: latex
self-contained: false
standalone: true
variables: {}
# The two this file may name, for the reader who edits the line above:
#   CJKmainfont: "…"     Han and kana — xeCJK's own variable, and it does not reach Hangul
#   mainfont: "…"        the document's own font, and the answer for any other script
metadata-files: []
include-before-body: []
include-after-body: []
include-in-header: []
bibliography: []
filters:
- type: citeproc
top-level-division: chapter
wrap: none
columns: 78
dpi: 72
toc: false
toc-depth: 2
number-sections: false
number-offset:
- 0
- 0
- 0
- 0
- 0
- 0
shift-heading-level-by: 0
section-divs: true
identifier-prefix: ''
title-prefix: ''
eol: lf
strip-comments: false
indented-code-classes: []
ascii: false
highlight-style: pygments
tab-stop: 4
preserve-tabs: false
fail-if-warnings: false
