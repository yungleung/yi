# ZETTLR DEFAULTS FILE
# ====================
# Conversion: Markdown --> HTML Document
# More info: https://pandoc.org/MANUAL.html
#
# Yi's copy of that file, as its `export.docx.yaml` is: it is written into the app's data folder the
# first time an export of this kind needs it, and every export then hands it to pandoc unchanged
# (`--defaults`), so a key below is pandoc's own and the manual above says what it means. A file
# that is already there is never overwritten — an edited one is the reader's.
#
# Zettlr's `default-image-extension: .jpg` is the one key left out, here and in every kind's file:
# pandoc applies it to an image destination whose path has no extension — a URL as well as a file —
# so a working web picture became `…/png.jpg` and a 404 (measured; `export.docx.yaml` has the long
# version). Left out, pandoc uses the path exactly as it was written.
#
# The card controls `self-contained` per export, and starts it **off**: the target is a folder that
# receives the page, its local pictures and the template's files. A reader who wants one HTML file
# for local media ticks the card's box; a picture written as a web URL stays that URL either way.
#
# `html-math-method: katex` is the exception to "one file": KaTeX is a script and a stylesheet, and
# pandoc inlines them only when it can fetch them — measured with a pandoc built without HTTP
# support (3.12.1), which warns and leaves `<script src="…/katex.min.js">` and
# `<link … katex.min.css>` in place, so the page renders its math when it is opened with a network
# and shows the reader's own TeX when it is not. No `url` is written: `katex` names the method, and
# pandoc supplies its own default CDN URLs. A reader who wants the math to render offline wants a
# different key: `method: mathml` needs no script at all.
#
# Two things the app adds on the command line, because they are its own settings rather than this
# file's: the bibliography the citations were formatted from (Settings → Citation) and the CSL style
# it formats them in, so citeproc resolves the keys and appends the reference list. A reader who
# wants none of that can set `filters: []` here, or clear the bibliography in the settings.
reader: markdown
writer: html
variables: {}
metadata-files: []
include-before-body: []
include-after-body: []
include-in-header: []
bibliography: []
filters:
- type: citeproc
top-level-division: chapter
wrap: none
columns: 78
dpi: 72
toc: false
toc-depth: 2
number-sections: false
number-offset:
- 0
- 0
- 0
- 0
- 0
- 0
shift-heading-level-by: 1
section-divs: true
identifier-prefix: ''
title-prefix: ''
eol: lf
strip-comments: false
indented-code-classes: []
ascii: false
highlight-style: pygments
html-math-method: katex
tab-stop: 4
preserve-tabs: false
html-q-tags: false
css: []
fail-if-warnings: false
