# MARKDOWN DEFAULTS FILE
# ======================
# Conversion: Markdown --> the same note, processed
# More info: https://pandoc.org/MANUAL.html
#
# Yi's own file, as `export.epub.yaml` is: written in the shape of the four beside it — they are
# copies of Zettlr's defaults — with the values this kind wants. Every choice was measured with
# pandoc 3.12.
#
# What the kind is for: the note **as every other export is handed it**. The app's pre-process
# (`src/ui/export/preprocess.ts`) is what the pipeline does before pandoc sees anything — each
# wikilink written as the words it renders as, each image's destination as the file the app resolved,
# each picture named on the web fetched into a local one — and this kind is that text, kept as a file
# of its own, with the citations resolved and their reference list appended. A reader hands it to
# something else, or reads what the app was going to write.
#
# Three values differ from the family, and they are the same rule each time: an output that says what
# the note says must not be re-styled into a different document.
#
# - `standalone: true`, and no `shift-heading-level-by`: the note's own metadata travels with it (as a
#   YAML block) and its headings keep their own levels. The family's `shift-heading-level-by: 1` is for
#   a *document*, whose own title sits above its first heading; a note re-leveled here would come back
#   with every heading one deeper. (Measured: without `standalone` the frontmatter is dropped
#   altogether, which is not "the same note, processed".)
# - `section-divs: false`, because a fenced div around every section is a change to the note rather
#   than a processing of it.
# - `top-level-division: default`, because there is nothing here to divide into chapters.
#
# Two things the app adds on the command line, as for every kind: the bibliography the citations were
# formatted from (Settings → Citation) and the CSL style it formats them in — which is what resolves
# the citations into their rendered forms and appends the reference list this kind is partly for.
#
# One thing about the *file name* this kind is written to: it is the note's own name with `.processed`
# before the extension (`note.processed.md`), because the default target is the note's own folder and
# its own name — and an export that writes over the note it is exporting is not one anybody means.
reader: markdown
writer: markdown
standalone: true
variables: {}
metadata-files: []
include-before-body: []
include-after-body: []
include-in-header: []
bibliography: []
filters:
- type: citeproc
top-level-division: default
wrap: none
columns: 78
dpi: 72
toc: false
toc-depth: 2
number-sections: false
number-offset:
- 0
- 0
- 0
- 0
- 0
- 0
section-divs: false
identifier-prefix: ''
title-prefix: ''
eol: lf
strip-comments: false
indented-code-classes: []
ascii: false
highlight-style: pygments
tab-stop: 4
preserve-tabs: false
fail-if-warnings: false
