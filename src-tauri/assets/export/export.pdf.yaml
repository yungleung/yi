# ZETTLR DEFAULTS FILE
# ====================
# Conversion: Markdown --> PDF (requires TeX suite to be installed)
# More info: https://pandoc.org/MANUAL.html
#
# Yi's copy of that file, as its `export.docx.yaml` is: it is written into the app's data folder the
# first time an export of this kind needs it, and every export then hands it to pandoc unchanged
# (`--defaults`), so a key below is pandoc's own and the manual above says what it means. A file that
# is already there is never overwritten — an edited one is the reader's. Zettlr's own comments are
# kept where they are, because they say what the values mean.
#
# Zettlr's `default-image-extension: .jpg` is the one key left out, here and in every kind's file:
# pandoc applies it to an image destination whose path has no extension — a URL as well as a file —
# so a working web picture became `…/png.jpg` and a 404 (measured; `export.docx.yaml` has the long
# version). Left out, pandoc uses the path exactly as it was written.
#
# The engine below is the one this kind runs: a machine without it fails with the engine's own
# sentence, which is what the reader is shown.
#
# **A note written in a script this file names no font for comes out without it**, which is why one is
# named below. Nothing named means XeTeX draws the page with its own Latin Modern, which holds Latin,
# its punctuation and the symbols a TeX font carries and nothing else: measured, a note written in
# `你好，世界` came out with the space its words took and none of the words (XeTeX warns *"Missing
# character: There is no 一 (U+4E00) in font [lmroman10-regular]"* for each, and the app shows those
# lines to the reader).
#
# **These fonts are the reader's**, and this file is only where they start. `CJKmainfont` below is the
# default — `Songti SC` — and what the two variables reach was measured, one page each, rather than
# assumed:
#
# - `CJKmainfont` is what xeCJK routes **CJK punctuation, kana, Han and Hangul** to. `Songti SC` draws
#   the first three and **has no Hangul**, so a Korean note loses it — measured: with both variables
#   named, the Hangul was set with the *CJK* font and came out missing.
# - `mainfont` is what every other script is set with: Greek, Cyrillic, Hebrew, Arabic, Devanagari
#   (and the other Indic scripts), Thai, Armenian, Georgian. It answers for anything the font it names
#   has, and it does **not** answer for Hangul while a CJK font is named.
#
# So the recipe depends on what your note is written in, and the app names the widest font it knows for
# your machine in its hint when a note needs one — **the card's line is the one to follow first**. For
# the rest:
#
# - **Han, kana, Chinese or Japanese**: nothing to add; the default covers it.
# - **Hangul**: a CJK font that has it — macOS `AppleGothic` or `Apple SD Gothic Neo`, Windows `Malgun
#   Gothic`, Linux `Noto Sans KR`.
# - **Greek, Cyrillic, Hebrew, Arabic, Devanagari, Thai, Armenian, Georgian**: `mainfont:` with a font
#   that has them. macOS `Arial Unicode MS` — *measured* here to draw every script in this list and keep
#   a `ToUnicode` map, so what is copied out of the page is the text that went in; Windows `Segoe UI`
#   (Greek, Cyrillic, Hebrew, Arabic), `Nirmala UI` (Indic), `Leelawadee UI` (Thai); Linux the `Noto`
#   face for the script, or `DejaVu Sans` / `FreeSerif` as the widest fallbacks. (Not measured here —
#   no Windows or Linux machine — and a name that is not there is not a smaller problem than a missing
#   character: XeTeX stops the whole export with *"The font … cannot be found"*.)
# - **Both at once** (a note in Hangul *and* something outside CJK): both lines, and the same font may
#   serve for both — *measured*: `mainfont` and `CJKmainfont` both naming `Arial Unicode MS` draws Han,
#   kana, Hangul, Greek and Devanagari on one page. It also sets the document's own text in that font,
#   which is the price of one font for everything.
#
#     variables:
#       mainfont: "…"                  # the font your machine has, from the list above
#       CJKmainfont: "Songti SC"       # CJK only — the default, and it is already set below
#
# Two things the app adds on the command line, as for every kind: the bibliography the citations were
# formatted from (Settings → Citation) and the CSL style it formats them in, so citeproc resolves the
# keys and appends the reference list.
reader: markdown
writer: pdf
self-contained: true
variables:
  # Sets the size of the document's pages.
  papersize: a4 # Possible values: a0-a6, b0-b6, c0-c6,b0j, letter, executive, legal
  # The typeface for CJK, and the reader's to change: see the note above for what it does and does not
  # cover.
  CJKmainfont: "Songti SC"
  # Further variables are documented here: https://pandoc.org/MANUAL.html#variables-for-latex
metadata-files: []
include-before-body: []
include-after-body: []
include-in-header: []
bibliography: []
filters:
- type: citeproc
top-level-division: default
pdf-engine: xelatex # Change this if you want to use a different engine, e.g. pdflatex
dpi: 72
toc: false # Include a table of contents?
toc-depth: 2 # 2 means to only include headings level 1 and 2 in the ToC
number-sections: false
number-offset:
- 0
- 0
- 0
- 0
- 0
- 0
shift-heading-level-by: 1
section-divs: true
identifier-prefix: ''
title-prefix: ''
eol: lf
strip-comments: false
indented-code-classes: []
ascii: false
highlight-style: pygments
tab-stop: 4
preserve-tabs: false
fail-if-warnings: false
