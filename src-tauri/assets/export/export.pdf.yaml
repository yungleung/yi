# ZETTLR DEFAULTS FILE
# ====================
# Conversion: Markdown --> PDF (requires TeX suite to be installed)
# More info: https://pandoc.org/MANUAL.html
#
# Yi's copy of that file, as its `export.docx.yaml` is: it is written into the app's data folder the
# first time an export of this kind needs it, and every export then hands it to pandoc unchanged
# (`--defaults`), so a key below is pandoc's own and the manual above says what it means. A file that
# is already there is never overwritten — an edited one is the reader's. Zettlr's own comments are
# kept where they are, because they say what the values mean.
#
# Zettlr's `default-image-extension: .jpg` is the one key left out, here and in every kind's file:
# pandoc applies it to an image destination whose path has no extension — a URL as well as a file —
# so a working web picture became `…/png.jpg` and a 404 (measured; `export.docx.yaml` has the long
# version). Left out, pandoc uses the path exactly as it was written.
#
# The engine below is the one this kind runs: a machine without it fails with the engine's own
# sentence, which is what the reader is shown.
#
# **A page has no font fallback.** A character outside the font in use is reported *missing character*
# and drawn as nothing: measured, a note written in `你好，世界` came out with the space its words took
# and none of the words (XeTeX warns *"Missing character: There is no 一 (U+4E00) in font
# [lmroman10-regular]"* for each, and the app shows those lines to the reader). So **this build draws
# the scripts itself**: it ships a face per script and writes a header of its own — `pdf-fonts.tex` in
# this folder, rewritten before every export — that hands XeTeX the right one per Unicode block, by a
# path into the app's own folders. Nothing has to be added here for:
#
#     Greek, Cyrillic, Hebrew, Arabic, Devanagari, Thai, Armenian, Georgian, Han, kana, Hangul.
#
# *Measured*: one line in each of those, with **no** font named in this file at all, is drawn — every
# script of them on one page, read back through the fonts' own `ToUnicode` maps
# (`test/probes/export-pdf-scripts.js` is that page).
#
# **What this file names still wins**, in two ways and no more:
#
# - `mainfont:` is the document's own font: Latin, its punctuation, and every block no shipped face
#   answers for. It is the line for a script *no* face is shipped for — Tamil, Ethiopic, Mongolian,
#   Tibetan and the rest — and the app's hint names the widest font this machine is known to have when
#   a note needs one. It does **not** take over the scripts listed above; those are drawn with the
#   shipped faces (or the ones named below) whatever this file says.
# - `yi-<script>-font:` names a face of your own for **one** of them, by the name this machine knows it
#   by: `yi-hebrew-font: "Frank Ruehl"`, `yi-thai-font: "Sarabun"`, `yi-greek-font: "…"` — one line per
#   script, and the scripts that have one are `greek`, `cyrillic`, `hebrew`, `arabic`, `devanagari`,
#   `thai`, `armenian`, `georgian` and `hangul`. Han and kana answer to `CJKmainfont` instead, which is
#   pandoc's own key; a script you name nothing for is drawn with the face this build ships.
# - `CJKmainfont:` is handed to Han and kana, by the name written here. A name the font lookup cannot
#   find — here or in a `yi-<script>-font:` line — stops the whole export with the engine's own
#   sentence (*"The font … cannot be found"*), rather than falling back to anything.
#
# **Hangul is why it is worth shipping a face at all**: `yi-hangul-font:` names one for it in the same
# way, and if this file names none it is drawn with the face this build ships — which is the point,
# because the fonts a platform has for Han very often have none of it (measured: the macOS `Songti SC`
# draws Han and kana and no Hangul, and a Korean note set in it lost every syllable).
#
# **The limits, measured.** The shipped Han face holds the unified ideographs (`U+4E00`–`U+9FFF`) and
# extension A in full, and only a few code points of extensions B to H — 2057 of extension B's 42,720,
# for one — so a note using those rare characters wants a `CJKmainfont:` that has them. Every other
# face holds its script's assigned code points: measured, no gap but the Coptic letters that sit in the
# Greek block (`U+03E2`–`U+03EF`), which no face here has.
#
# The one font named in the card's hint, on a machine that has it, is macOS `Arial Unicode MS` —
# *measured* to draw all of these scripts and keep a `ToUnicode` map, so what is copied out of a page
# is the text that went in. A platform with no entry is named nothing rather than guessed at.
#
# **And that leaves a reader on another platform a procedure instead of a name**, which is the honest
# half of the same rule: a font is named only where the drawing was measured, so what is left to say is
# where this machine's own fonts are written down — Font Book on macOS, *Settings → Personalisation →
# Fonts* on Windows, `fc-list : family` on Linux (or the font folder the desktop shows) — and what to
# look for in it: a face that has the script the note is in, a "Noto" one for that script or a system
# font for the region, or one wide font for everything. The one thing not to write is a name the
# machine does not have: that stops the export rather than falling back to anything.
#
# Two things the app adds on the command line, as for every kind: the bibliography the citations were
# formatted from (Settings → Citation) and the CSL style it formats them in, so citeproc resolves the
# keys and appends the reference list.
reader: markdown
writer: pdf
self-contained: true
variables:
  # Sets the size of the document's pages.
  papersize: a4 # Possible values: a0-a6, b0-b6, c0-c6,b0j, letter, executive, legal
  # The two fonts this file may name, and what each reaches: see the note above. Neither is needed for
  # the scripts this build draws itself.
  # mainfont: "…"                  # the document's own font, and the answer for any script with no face
  # yi-hebrew-font: "Frank Ruehl"  # one script at a time: greek, cyrillic, hebrew, arabic, devanagari,
  #                                # thai, armenian, georgian, hangul — by a name this machine knows
  # CJKmainfont: "Songti SC"       # Han and kana, pandoc's own key for them
  # Further variables are documented here: https://pandoc.org/MANUAL.html#variables-for-latex
metadata-files: []
include-before-body: []
include-after-body: []
include-in-header: []
bibliography: []
filters:
- type: citeproc
top-level-division: default
pdf-engine: xelatex # Change this if you want to use a different engine, e.g. pdflatex
dpi: 72
toc: false # Include a table of contents?
toc-depth: 2 # 2 means to only include headings level 1 and 2 in the ToC
number-sections: false
number-offset:
- 0
- 0
- 0
- 0
- 0
- 0
shift-heading-level-by: 1
section-divs: true
identifier-prefix: ''
title-prefix: ''
eol: lf
strip-comments: false
indented-code-classes: []
ascii: false
highlight-style: pygments
tab-stop: 4
preserve-tabs: false
fail-if-warnings: false
